  <script src="../../assets/js/quiz-engine.js"></script>
  <script>
    QuizEngine.init({
      id: "1ere-coral-reefs",
      title: "Coral Reefs and Ocean Health",
      level: "1re euro — B2",
      sequence: "Séquence 4 — DNL SVT — Écosystèmes marins",
      duration: "~15 min",
      intro: "This quiz explores the fragile beauty of coral reefs and the threats they face: bleaching, pollution, ocean acidification. It mobilises advanced scientific vocabulary, comparative structures, and data interpretation.",

      questions: [

        {
          type: "qcm",
          prompt: "What ARE corals, biologically?",
          options: [
            "Plants",
            "Tiny invertebrate animals (cnidarians) living in colonies",
            "Rocks",
            "A type of seaweed",
          ],
          answer: 1,
          explanation: "Les coraux sont des <b>animaux invertébrés</b> de la famille des cnidaires (comme les méduses). Chaque polype (animal) sécrète un squelette calcaire. La colonie forme le récif.",
        },

        {
          type: "matching",
          prompt: "Match each marine concept with its definition.",
          hint: "Vocabulaire scientifique des récifs.",
          pairs: [
            { left: "Coral bleaching",   right: "Loss of zooxanthellae symbionts due to stress" },
            { left: "Ocean acidification", right: "Lower pH from CO2 absorption" },
            { left: "Symbiosis",          right: "Mutually beneficial relationship between species" },
            { left: "Marine biodiversity", right: "Variety of species in marine ecosystems" },
          ],
        },

        {
          type: "saisie",
          prompt: "How long is the Great Barrier Reef? (in km, 4 digits, approximate)",
          placeholder: "Example: 1500",
          answer: ["2300", "2,300"],
          explanation: "La <b>Grande Barrière de Corail</b> mesure environ <b>2 300 km</b> le long de la côte est de l'Australie. Visible depuis l'espace, c'est le plus grand organisme vivant de la planète.",
        },

        {
          type: "qcm",
          prompt: "Which gas, when absorbed by oceans, causes acidification?",
          options: [
            "Oxygen (O₂)",
            "Carbon dioxide (CO₂)",
            "Nitrogen (N₂)",
            "Methane (CH₄)",
          ],
          answer: 1,
          explanation: "Le <b>CO₂</b>, dissous dans l'eau de mer, forme de l'acide carbonique (H₂CO₃) qui réduit le pH des océans. Depuis 1750, le pH a baissé de ~0,1, ce qui représente une acidification de 30%.",
        },

        {
          type: "vrai-faux",
          prompt: "Coral reefs cover less than 1% of the ocean floor but host about 25% of all marine species.",
          answer: "vrai",
          explanation: "Vrai ! Les récifs couvrent <b>0,2%</b> de la surface des océans mais hébergent <b>25%</b> de la biodiversité marine. C'est pourquoi on les appelle les « forêts tropicales des océans ».",
        },

        {
          type: "cloze",
          prompt: "Complete this scientific paragraph.",
          parts: [
            { text: "Coral reefs " },
            { gap: ["have been threatened", "is threatened", "threaten", "threatening"], answer: 0 },
            { text: " by climate change for decades. If global temperatures " },
            { gap: ["continue", "will continue", "are continuing", "had continued"], answer: 0 },
            { text: " to rise, scientists predict that 90% of corals " },
            { gap: ["may disappear", "may disappears", "disappear may", "may to disappear"], answer: 0 },
            { text: " by 2050." },
          ],
        },

        {
          type: "qcm",
          prompt: "What is the symbiotic relationship between corals and algae called?",
          options: [
            "Parasitism",
            "Zooxanthellae symbiosis",
            "Predation",
            "Mutualism with bacteria only",
          ],
          answer: 1,
          explanation: "Les coraux abritent des <b>zooxanthelles</b>, micro-algues qui réalisent la photosynthèse et fournissent jusqu'à <b>90%</b> de l'énergie du corail. C'est une symbiose mutualiste obligatoire — pas de zooxanthelles = pas de corail vivant.",
        },

        {
          type: "multi",
          prompt: "Tick ALL major threats to coral reefs:",
          options: [
            "Ocean warming",
            "Acidification",
            "Plastic pollution",
            "Wind speed",
            "Overfishing and destructive fishing practices",
          ],
          answer: ["0", "1", "2", "4"],
          explanation: "Warming, acidification, pollution plastique et surpêche sont les 4 grandes menaces. Le vent n'est pas une menace majeure (les récifs sont sous-marins).",
        },

        {
          type: "ordering",
          prompt: "Put these stages of coral bleaching in order.",
          hint: "From healthy reef to dead reef.",
          items: [
            "A healthy colourful coral reef with diverse fish",
            "Heat stress affects the coral",
            "Coral expels its zooxanthellae (bleaching begins)",
            "The coral turns white but is still alive",
            "Without recovery, the coral dies and the reef collapses",
          ],
        },

        {
          type: "qcm",
          prompt: "Why are Madagascar's coral reefs especially important?",
          options: [
            "They are larger than the Great Barrier Reef",
            "They are part of one of the world's biodiversity hotspots and protect coastlines",
            "They are the only reefs in the Southern Hemisphere",
            "They are entirely artificial",
          ],
          answer: 1,
          explanation: "Madagascar fait partie du <b>hotspot de biodiversité de l'Indo-Pacifique</b>. Les récifs malgaches (Nosy Be, Toliara, etc.) protègent les côtes contre l'érosion et les cyclones, en plus de leur richesse écologique.",
        },

      ],
    });
  </script>
