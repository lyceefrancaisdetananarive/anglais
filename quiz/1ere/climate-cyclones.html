  <script src="../../assets/js/quiz-engine.js"></script>
  <script>
    QuizEngine.init({
      id: "1ere-climate-cyclones",
      title: "Climate Change &amp; Tropical Cyclones",
      level: "1re euro — B1+/B2",
      sequence: "Séquence 2 — DNL SVT — Climatologie",
      duration: "~15 min",
      intro: "This quiz explores tropical cyclones — a phenomenon that hits Madagascar every year. It mobilises scientific vocabulary (meteorology, ocean physics), modal verbs of probability, and your understanding of climate change linkages.",

      questions: [

        {
          type: "qcm",
          prompt: "What is the difference between a cyclone, a hurricane and a typhoon?",
          options: [
            "They are different storms with different physics",
            "They are the same storm, but the name depends on the ocean basin",
            "Hurricanes are stronger than cyclones",
            "Typhoons only occur in winter",
          ],
          answer: 1,
          explanation: "C'est exactement le <b>même phénomène</b> météorologique. On dit <i>cyclone</i> dans l'océan Indien et le Pacifique sud (Madagascar), <i>hurricane</i> dans l'Atlantique et le Pacifique nord-est, <i>typhoon</i> dans le Pacifique nord-ouest.",
        },

        {
          type: "matching",
          prompt: "Match each cyclone term with its definition.",
          hint: "Vocabulaire scientifique du cyclone.",
          pairs: [
            { left: "Eye",        right: "Calm centre of the cyclone" },
            { left: "Eyewall",    right: "Strongest winds, around the eye" },
            { left: "Storm surge", right: "Rise in sea level pushed by winds" },
            { left: "Saffir-Simpson scale", right: "Classification of cyclone intensity (1-5)" },
          ],
        },

        {
          type: "saisie",
          prompt: "How is a cyclone classified on the Saffir-Simpson scale? (one number is the maximum)",
          placeholder: "Exemple : 7",
          answer: ["5", "five", "Five"],
          explanation: "L'échelle de Saffir-Simpson va de 1 (vents 119-153 km/h) à <b>5</b> (vents > 252 km/h). Catégorie 5 = ouragan « catastrophique ».",
        },

        {
          type: "qcm",
          prompt: "« A category 5 cyclone _____ cause catastrophic damage and complete destruction. » (choose the strongest modal)",
          options: ["may", "might", "could", "will"],
          answer: 3,
          explanation: "Pour exprimer une certitude scientifique, on utilise <i>will</i>. <i>May/might/could</i> expriment une possibilité plus faible. Cat 5 = destruction quasi-certaine.",
        },

        {
          type: "vrai-faux",
          prompt: "Cyclone Batsirai (Feb 2022) made landfall on Madagascar's east coast and killed over 100 people.",
          answer: "vrai",
          explanation: "Le cyclone Batsirai a frappé l'est de Madagascar le 5 février 2022, faisant plus de 120 morts et 124 000 sinistrés. Suivi quelques semaines plus tard par Emnati. Année tragique 2022.",
        },

        {
          type: "cloze",
          prompt: "Complete this scientific paragraph on climate change and cyclones.",
          parts: [
            { text: "Tropical cyclones " },
            { gap: ["are formed", "form", "is forming", "formed"], answer: 0 },
            { text: " over warm ocean waters above 26.5°C. As global temperatures rise, scientists predict cyclones " },
            { gap: ["will become", "are becoming", "become", "had become"], answer: 0 },
            { text: " more intense, even if their total number " },
            { gap: ["may decrease", "may decreases", "decreases may", "decreasing"], answer: 0 },
            { text: "." },
          ],
        },

        {
          type: "qcm",
          prompt: "Which body produces authoritative scientific reports on climate change?",
          options: [
            "WHO (World Health Organization)",
            "IPCC (Intergovernmental Panel on Climate Change)",
            "NATO",
            "UNESCO",
          ],
          answer: 1,
          explanation: "Le <b>GIEC</b> (en français) ou <b>IPCC</b> (en anglais) est l'organisme de l'ONU qui synthétise la science du climat depuis 1988. Ses rapports sont la référence mondiale.",
        },

        {
          type: "multi",
          prompt: "Tick ALL impacts of tropical cyclones on Madagascar:",
          options: [
            "Storm surge flooding coastal areas",
            "Heavy rainfall causing landslides",
            "Snowfall in the highlands",
            "Crop destruction (rice, vanilla)",
            "Solar eclipse phenomena",
          ],
          answer: ["0", "1", "3"],
          explanation: "Les cyclones provoquent surge, pluies torrentielles et destruction des récoltes (notamment riz et vanille). Pas de neige tropicale, pas d'éclipses (phénomène astronomique sans rapport).",
        },

        {
          type: "ordering",
          prompt: "Put these stages of a tropical cyclone formation in order.",
          hint: "From a small disturbance to a full cyclone.",
          items: [
            "A tropical disturbance forms over warm ocean waters",
            "Wind speeds increase: tropical depression",
            "Tropical storm (named at this stage)",
            "Tropical cyclone (winds ≥ 119 km/h)",
            "Landfall, weakening over land",
          ],
        },

        {
          type: "qcm",
          prompt: "What is the primary reason tropical cyclones weaken when they make landfall?",
          options: [
            "Land is colder than the ocean",
            "The cyclone's energy source (warm ocean water) is removed",
            "Mountains push the cyclone away",
            "Trees absorb the wind",
          ],
          answer: 1,
          explanation: "Les cyclones tirent leur énergie de l'<b>évaporation des eaux chaudes</b>. Sur terre, cette source disparaît, donc le cyclone faiblit en quelques heures. Mais les pluies peuvent durer plusieurs jours après.",
        },

      ],
    });
  </script>

  <script src="../../assets/js/analytics.js" defer></script>
