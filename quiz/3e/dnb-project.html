  <script src="../../assets/js/quiz-engine.js"></script>
  <script>
    QuizEngine.init({
      id: "3e-dnb-project",
      title: "My DNB Project — Oral Preparation",
      level: "3e — B1",
      sequence: "Séquence 6 — Méthodologie de l'oral DNB",
      duration: "~12 min",
      intro: "Final 3e quiz! Préparation à l'oral du DNB (Histoire des Arts, Parcours Avenir ou Citoyen). Mobilise les connecteurs argumentatifs, les expressions d'opinion, et les techniques pour gérer le stress.",

      questions: [

        {
          type: "qcm",
          prompt: "How long does the DNB oral last (in total)?",
          options: ["5 minutes", "10 minutes (5 min talk + 5 min Q&A)", "15 minutes (5 min talk + 10 min Q&A)", "30 minutes"],
          answer: 2,
          explanation: "L'oral du DNB dure <b>15 minutes</b> au total : 5 minutes de présentation suivies de 10 minutes d'entretien avec le jury (questions et discussion).",
        },

        {
          type: "matching",
          prompt: "Match each connector with its function in argumentation.",
          hint: "Indice : connecteurs essentiels pour l'oral.",
          pairs: [
            { left: "However",        right: "Opposition / contraste" },
            { left: "Therefore",      right: "Conséquence / conclusion" },
            { left: "For example",    right: "Illustration concrète" },
            { left: "In conclusion",  right: "Clôture du propos" },
          ],
        },

        {
          type: "saisie",
          prompt: "Quelle est l'expression la plus naturelle pour donner son avis personnel à l'oral ?",
          placeholder: "Indice : commence par « In »",
          answer: [
            "in my opinion",
            "In my opinion",
            "In My Opinion",
          ],
          explanation: "<b>« In my opinion »</b> est l'expression la plus standard pour exprimer son point de vue. Variantes : <i>I think that, To me, I believe that, From my perspective</i>.",
        },

        {
          type: "qcm",
          prompt: "What is the BEST strategy if you forget a word during your oral?",
          options: [
            "Stop and panic",
            "Switch to French immediately",
            "Use a synonym or paraphrase the idea",
            "Repeat the previous sentence many times",
          ],
          answer: 2,
          explanation: "<b>Paraphrase / use synonyms</b> = la meilleure stratégie. Si tu oublies <i>endangered</i>, dis <i>« in danger of disappearing »</i>. Le jury valorise ta capacité à contourner les difficultés.",
        },

        {
          type: "vrai-faux",
          prompt: "You can read your notes word-for-word during the DNB oral.",
          answer: "faux",
          explanation: "Faux ! Tu peux <b>regarder tes notes brièvement</b> mais pas les lire entièrement. Le jury valorise la prise de parole spontanée et le contact visuel. Note : juste des mots-clés et une trame, pas de texte rédigé.",
        },

        {
          type: "cloze",
          prompt: "Complete this introduction template for an oral presentation.",
          parts: [
            { text: "Today, I " },
            { gap: ["am going to", "go to", "going", "will going"], answer: 0 },
            { text: " present my project on Banksy. I " },
            { gap: ["chose", "choose", "choosing", "had chose"], answer: 0 },
            { text: " this topic because street art " },
            { gap: ["interest", "interests", "is interested", "interesting"], answer: 1 },
            { text: " me. My presentation has three parts." },
          ],
        },

        {
          type: "qcm",
          prompt: "Which structure helps a clear oral presentation?",
          options: [
            "Read everything from a paper",
            "Introduction → 2 or 3 main parts → Conclusion",
            "Speak as fast as possible to fit in 5 minutes",
            "Improvise without any plan",
          ],
          answer: 1,
          explanation: "Le <b>plan classique en 3 temps</b> (Introduction → Développement en 2-3 parties → Conclusion) est le standard attendu. Annonce ton plan dans l'intro pour aider le jury à te suivre.",
        },

        {
          type: "multi",
          prompt: "Tick ALL good practices for the DNB oral:",
          options: [
            "Make eye contact with the jury",
            "Speak clearly and at a moderate pace",
            "Wear something formal and clean",
            "Read your text word-for-word",
            "Practice with friends and family before the day",
          ],
          answer: ["0", "1", "2", "4"],
          explanation: "Eye contact, voix claire, tenue correcte et entraînement préalable sont des bonnes pratiques. Lire son texte mot à mot est l'erreur la plus courante à éviter.",
        },

        {
          type: "ordering",
          prompt: "Put these steps for preparing your DNB oral in order.",
          hint: "From the start of preparation to the day of the oral.",
          items: [
            "Choose your project topic",
            "Research and gather information",
            "Write a structured outline (not a full text)",
            "Practice in front of family or friends",
            "Stay calm on the day and breathe deeply",
          ],
        },

        {
          type: "qcm",
          prompt: "What should you do if you don't understand a question from the jury?",
          options: [
            "Stay silent and look at the floor",
            "Politely ask: « Could you repeat / rephrase your question, please? »",
            "Make up an answer that has nothing to do with it",
            "Leave the room",
          ],
          answer: 1,
          explanation: "<b>Demander poliment de reformuler</b> est attendu et valorisé : <i>« Could you repeat your question, please? »</i> ou <i>« Could you rephrase that? »</i>. Cela montre ta maîtrise de l'interaction orale.",
        },

      ],
    });
  </script>

  <script src="../../assets/js/analytics.js" defer></script>
