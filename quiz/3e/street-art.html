  <script src="../../assets/js/quiz-engine.js"></script>
  <script>
    QuizEngine.init({
      id: "3e-street-art-v2",
      title: "Street Art: The Voice of the Wall",
      level: "3e — A2+/B1",
      sequence: "Séquence 1 — Street Art",
      duration: "~15 min",
      heroImage: "../../assets/img/sequences/street-art/banksy-style-mural.jpg",
      intro: "Bienvenue sur le quiz Street Art ! Tu vas rencontrer plusieurs types d'activités : compréhension orale, image, association, remise en ordre, texte à trous, QCM. Bonne chance !",

      questions: [

        // Q1 — IMAGE-QCM (vocabulaire visuel)
        {
          type: "image-qcm",
          prompt: "Observe ce mur. Quelle technique l'artiste a-t-il utilisée ?",
          imageSrc: "../../assets/img/sequences/street-art/banksy-style-mural.jpg",
          imageAlt: "Mur avec une œuvre de street art",
          imageCaption: "Photo : Unsplash · usage pédagogique LFT",
          options: [
            "A tag (a quick signature with spray paint)",
            "A stencil (a paper template + spray paint)",
            "A sticker (a printed adhesive)",
            "A mosaic (small pieces of glass or tile)",
          ],
          answer: 1,
          explanation: "Cette œuvre est créée avec un <b>stencil</b> (pochoir) : un gabarit en papier découpé est plaqué sur le mur, puis l'artiste vaporise de la peinture. C'est la technique signature de Banksy.",
        },

        // Q2 — AUDIO-QCM (compréhension orale Try n' Fly)
        {
          type: "audio-qcm",
          prompt: "Listen to this audio extract from your manual. What is the main topic?",
          audioSrc: "../../assets/audio/3e_street_art_eval_co.mp3",
          audioCaption: "Listening — Try n' Fly 3e — Flight 5",
          audioHint: "Tu peux écouter deux fois si nécessaire.",
          options: [
            "A famous painter's biography",
            "Street art and urban culture",
            "A football match in London",
            "A weather report",
          ],
          answer: 1,
          explanation: "L'extrait porte sur le street art (= street art and urban culture). Concentre-toi sur les mots-clés répétés : <i>street art</i>, <i>graffiti</i>, <i>artist</i>, <i>wall</i>...",
        },

        // Q3 — MATCHING (artiste ↔ œuvre)
        {
          type: "matching",
          prompt: "Match each artist with their famous work.",
          hint: "Indice : pense aux artistes que tu as étudiés en classe.",
          pairs: [
            { left: "Banksy",          right: "Girl with Balloon (London, 2002)" },
            { left: "Keith Haring",    right: "Crack is Wack (NYC, 1986)" },
            { left: "Shepard Fairey",  right: "Hope (Obama portrait, 2008)" },
            { left: "Jean-Michel Basquiat", right: "SAMO© tags (NYC, late 1970s)" },
          ],
        },

        // Q4 — CLOZE (voix passive)
        {
          type: "cloze",
          prompt: "Complète ce texte sur Banksy en choisissant la bonne forme verbale.",
          parts: [
            { text: "This famous mural " },
            { gap: ["was painted", "is painting", "paints", "has been paint"], answer: 0 },
            { text: " by Banksy in 2010. The wall " },
            { gap: ["is photograph", "was photographed", "photographs", "has photograph"], answer: 1 },
            { text: " by hundreds of tourists every day. Today, the artwork " },
            { gap: ["protects", "is protecting", "is protected", "protected"], answer: 2 },
            { text: " by a sheet of plexiglas." },
          ],
        },

        // Q5 — ORDERING (étapes de création)
        {
          type: "ordering",
          prompt: "Mets ces étapes de création d'un pochoir dans le bon ordre.",
          hint: "Réfléchis au workflow d'un artiste de rue.",
          items: [
            "Imagine an image and design it on paper",
            "Cut the stencil with a sharp knife",
            "Find a wall and check it's safe",
            "Hold the stencil firmly against the wall",
            "Spray paint over the stencil",
            "Photograph the result before it's covered",
          ],
        },

        // Q6 — VRAI/FAUX (culture)
        {
          type: "vrai-faux",
          prompt: "Banksy est un artiste britannique dont la véritable identité a été révélée publiquement.",
          answer: "faux",
          explanation: "Banksy est britannique mais son identité reste anonyme à ce jour. C'est l'un des piliers de sa démarche artistique : <i>« Anonymity is part of the work. »</i>",
        },

        // Q7 — IMAGE-QCM (graffiti vs street art)
        {
          type: "image-qcm",
          prompt: "What can you see in this image?",
          imageSrc: "../../assets/img/sequences/street-art/graffiti-tag.jpg",
          imageAlt: "Mur couvert de tags et graffitis",
          options: [
            "A planned mural with a clear message",
            "Tags — quick signatures on a wall",
            "An advertising poster",
            "A photograph framed in a museum",
          ],
          answer: 1,
          explanation: "On voit ici des <b>tags</b> : signatures rapides à la bombe, sans recherche figurative. C'est une forme primitive du graffiti, distincte du street art figuratif (Banksy, Keith Haring).",
        },

        // Q8 — MULTI (vocabulaire)
        {
          type: "multi",
          prompt: "Coche TOUTES les expressions correctes pour donner son avis en anglais :",
          options: [
            "I think that...",
            "In my opinion...",
            "I am agree with...",
            "It seems to me that...",
            "According to me...",
          ],
          answer: ["0", "1", "3"],
          explanation: "« I am agree » est incorrect (pas de <i>to be</i> devant <i>agree</i>). « According to me » est un calque français : on dit <i>In my opinion</i> ou <i>To me</i>.",
        },

        // Q9 — SAISIE (voix passive transformation)
        {
          type: "saisie",
          prompt: "Mets cette phrase à la voix passive : « Banksy painted this mural in 2010. »",
          placeholder: "This mural...",
          answer: [
            "this mural was painted by banksy in 2010",
            "this mural was painted by banksy in 2010.",
          ],
          explanation: "Voix passive au prétérit : sujet (this mural) + was/were + participe passé (painted) + by + agent + complément de temps.",
        },

        // Q10 — QCM final (synthèse)
        {
          type: "qcm",
          prompt: "Pourquoi Banksy choisit-il souvent la rue plutôt qu'une galerie pour exposer ?",
          options: [
            "Parce que ses œuvres sont trop grandes pour une galerie",
            "Parce qu'il veut atteindre un public large et délivrer un message politique",
            "Parce qu'il ne peut pas vendre ses œuvres en galerie",
            "Parce que les galeries lui sont interdites",
          ],
          answer: 1,
          explanation: "Banksy utilise l'espace public pour s'adresser à TOUT le monde et porter un message engagé (anti-guerre, immigration, consommation). C'est l'idée que l'art doit sortir des musées pour intervenir dans la cité.",
        },
      ],
    });
  </script>
