  <script src="../../assets/js/quiz-engine.js"></script>
  <script>
    QuizEngine.init({
      id: "lce-britain-europe",
      title: "Britain & Europe",
      level: "4e LCE — A2+",
      sequence: "Module 1 — Histoire des relations RU-Europe",
      duration: "~12 min",
      intro: "Quiz culturel sur les liens entre le Royaume-Uni et le continent européen, de la conquête normande au Brexit. Mobilise prétérit, dates historiques, et lexique politique.",

      questions: [

        {
          type: "qcm",
          prompt: "When did William the Conqueror invade England?",
          options: ["1066", "1166", "1500", "1789"],
          answer: 0,
          explanation: "<b>1066</b> — la bataille d'Hastings. Guillaume le Conquérant, duc de Normandie, vainc le roi anglo-saxon Harold II. Cet événement transforme profondément la langue anglaise (apport massif du français).",
        },

        {
          type: "matching",
          prompt: "Match each event with its date.",
          hint: "Indice : grandes étapes des relations RU-Europe.",
          pairs: [
            { left: "Normand Conquest of England", right: "1066" },
            { left: "Hundred Years' War begins",   right: "1337" },
            { left: "UK joins the European Community", right: "1973" },
            { left: "Brexit referendum",           right: "23 June 2016" },
          ],
        },

        {
          type: "saisie",
          prompt: "Quel pourcentage des Britanniques a voté pour le Brexit en 2016 ? (chiffre approximatif, 1 nombre)",
          placeholder: "Exemple : 60",
          answer: ["52", "51.9", "51,9"],
          explanation: "<b>52%</b> des Britanniques (51,9% précisément) ont voté pour quitter l'UE le 23 juin 2016. Le scrutin était très serré : 17,4 M de \"Leave\" contre 16,1 M de \"Remain\".",
        },

        {
          type: "qcm",
          prompt: "Which UK Prime Minister negotiated the country's entry into the European Economic Community (EEC) in 1973?",
          options: [
            "Winston Churchill",
            "Margaret Thatcher",
            "Edward Heath",
            "Tony Blair",
          ],
          answer: 2,
          explanation: "<b>Edward Heath</b> (Conservative) a fait entrer le RU dans la CEE le 1<sup>er</sup> janvier 1973. Cette décision a été ratifiée par référendum en 1975 (67% pour le maintien).",
        },

        {
          type: "vrai-faux",
          prompt: "The Hundred Years' War actually lasted 116 years (1337-1453).",
          answer: "vrai",
          explanation: "Vrai ! La « guerre de Cent Ans » a en réalité duré <b>116 ans</b> — c'est une appellation rétrospective. Elle opposa les royaumes de France et d'Angleterre pour la couronne de France.",
        },

        {
          type: "cloze",
          prompt: "Complete this paragraph on Brexit.",
          parts: [
            { text: "On 23 June 2016, British citizens " },
            { gap: ["voted", "vote", "is voting", "have voted"], answer: 0 },
            { text: " to leave the European Union. The UK officially " },
            { gap: ["leave", "left", "leaved", "leaves"], answer: 1 },
            { text: " the EU on 31 January 2020. The transition period " },
            { gap: ["ended", "ends", "is ending", "have ended"], answer: 0 },
            { text: " on 31 December 2020." },
          ],
        },

        {
          type: "qcm",
          prompt: "What does « EU » stand for?",
          options: [
            "European Union",
            "European University",
            "Euro Unit",
            "England United",
          ],
          answer: 0,
          explanation: "<b>European Union</b> (Union européenne). Créée en 1993 par le traité de Maastricht, elle compte aujourd'hui 27 États membres (le RU est sorti en 2020).",
        },

        {
          type: "multi",
          prompt: "Tick ALL UK Prime Ministers (past or current):",
          options: [
            "Boris Johnson",
            "Joe Biden",
            "Theresa May",
            "Emmanuel Macron",
            "Margaret Thatcher",
          ],
          answer: ["0", "2", "4"],
          explanation: "Boris Johnson, Theresa May et Margaret Thatcher ont tous été PM britanniques. Joe Biden est président des USA, Emmanuel Macron président français.",
        },

        {
          type: "ordering",
          prompt: "Put these key UK-Europe events in chronological order.",
          hint: "From earliest to most recent.",
          items: [
            "Norman Conquest (1066)",
            "Hundred Years' War (1337-1453)",
            "Treaty of Versailles (1919)",
            "UK joins EEC (1973)",
            "Brexit takes effect (Jan 2020)",
          ],
        },

        {
          type: "qcm",
          prompt: "Which of these is NOT a country in the United Kingdom?",
          options: [
            "England",
            "Scotland",
            "Wales",
            "Ireland",
          ],
          answer: 3,
          explanation: "Le Royaume-Uni est composé de l'Angleterre, l'Écosse, le Pays de Galles et l'<b>Irlande du Nord</b> (Northern Ireland) — pas l'Irlande, qui est un État indépendant (Republic of Ireland) depuis 1949.",
        },

      ],
    });
  </script>
