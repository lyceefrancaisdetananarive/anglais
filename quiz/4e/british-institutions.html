  <script src="../../assets/js/quiz-engine.js"></script>
  <script>
    QuizEngine.init({
      id: "4e-non-si-british-institutions",
      title: "British Institutions",
      level: "4e NON SI — B1",
      sequence: "Séquence 3 — Monarchie, Parlement, Brexit",
      duration: "~15 min",
      intro: "Final 4e NON SI quiz! Découvre les institutions britanniques : la monarchie, le Parlement (Commons + Lords), le Premier ministre, le Brexit, le Commonwealth. Mobilise modaux de probabilité et structures complexes.",

      questions: [

        {
          type: "qcm",
          prompt: "Who is the current Head of State of the United Kingdom (2026)?",
          options: [
            "Queen Elizabeth II",
            "King Charles III",
            "The Prime Minister",
            "The Speaker of the House",
          ],
          answer: 1,
          explanation: "<b>King Charles III</b> est monté sur le trône en septembre 2022 après la mort de la reine Elizabeth II. Il est <i>Head of State</i> (chef d'État symbolique), pas <i>Head of Government</i> (rôle du Premier ministre).",
        },

        {
          type: "matching",
          prompt: "Match each institution with its role.",
          hint: "Les piliers du système britannique.",
          pairs: [
            { left: "House of Commons",   right: "Elected MPs who debate and vote laws" },
            { left: "House of Lords",     right: "Unelected chamber that revises bills" },
            { left: "Prime Minister",     right: "Head of Government, leader of majority party" },
            { left: "Monarch",            right: "Head of State, symbolic role" },
          ],
        },

        {
          type: "saisie",
          prompt: "Complète : « MPs ___ ___ in the House of Commons. » (verbe + lieu) — au présent",
          placeholder: "Exemple : are sitting / sit and debate",
          answer: ["sit and debate", "Sit and debate", "debate", "Debate"],
          explanation: "Les <b>MPs (Members of Parliament)</b> siègent et débattent à la <i>House of Commons</i>. Une réponse simple comme <i>debate</i> ou <i>sit and debate</i> est acceptée.",
        },

        {
          type: "qcm",
          prompt: "What does « Brexit » refer to?",
          options: [
            "A famous British breakfast",
            "The UK leaving the European Union (officially in 2020)",
            "A rugby tournament",
            "A British TV show",
          ],
          answer: 1,
          explanation: "<b>Brexit</b> = <i>British Exit</i>. Référendum en juin 2016 (52% pour Leave), sortie effective le 31 janvier 2020. Période de transition jusqu'au 31 décembre 2020. Conséquences économiques et politiques majeures.",
        },

        {
          type: "vrai-faux",
          prompt: "The UK has a written constitution like the US.",
          answer: "faux",
          explanation: "Faux ! Le Royaume-Uni n'a <b>pas de constitution écrite unique</b>. Sa « constitution » est dite <i>uncodified</i> : composée de lois (Magna Carta 1215, Bill of Rights 1689), de conventions et de jurisprudence.",
        },

        {
          type: "cloze",
          prompt: "Complete with the right modal or tense.",
          parts: [
            { text: "The monarch " },
            { gap: ["must", "may", "should", "would"], answer: 0 },
            { text: " sign every law passed by Parliament. The Prime Minister " },
            { gap: ["might", "must", "may", "could"], answer: 1 },
            { text: " resign if Parliament loses confidence. Brexit " },
            { gap: ["has changed", "changes", "is changing", "has been changed"], answer: 0 },
            { text: " UK-EU relations forever." },
          ],
        },

        {
          type: "qcm",
          prompt: "Where does the Prime Minister live and work?",
          options: [
            "Buckingham Palace",
            "10 Downing Street",
            "Westminster Abbey",
            "The Tower of London",
          ],
          answer: 1,
          explanation: "<b>10 Downing Street</b> à Londres est la résidence et le bureau du Premier ministre depuis 1735. Buckingham Palace est la résidence du monarque, Westminster Abbey une église, et la Tour de Londres une forteresse historique.",
        },

        {
          type: "multi",
          prompt: "Tick ALL nations that form the United Kingdom:",
          options: [
            "England",
            "Scotland",
            "Wales",
            "Republic of Ireland",
            "Northern Ireland",
          ],
          answer: ["0", "1", "2", "4"],
          explanation: "Le Royaume-Uni = <b>England + Scotland + Wales + Northern Ireland</b>. La <i>Republic of Ireland</i> est un pays indépendant depuis 1922 (Eire). « Great Britain » = England + Scotland + Wales (sans Northern Ireland).",
        },

        {
          type: "ordering",
          prompt: "Put these stages of a UK law in order.",
          hint: "From idea to royal assent.",
          items: [
            "First reading in the House of Commons",
            "Detailed debate (Committee Stage) and report",
            "Vote in the House of Commons",
            "Review and amendments by the House of Lords",
            "Royal Assent — the monarch signs the bill into law",
          ],
        },

        {
          type: "qcm",
          prompt: "What is the « Commonwealth »?",
          options: [
            "A British supermarket chain",
            "An association of 56 countries, mostly former British colonies",
            "Another word for the UK",
            "A Brexit-era trade organisation",
          ],
          answer: 1,
          explanation: "Le <b>Commonwealth of Nations</b> regroupe 56 États (la plupart anciennes colonies britanniques) liés par une histoire commune. Inclut Australie, Canada, Inde, Afrique du Sud, etc. Le monarque britannique en est le chef symbolique.",
        },

      ],
    });
  </script>

  <script src="../../assets/js/analytics.js" defer></script>
