  <script src="../../assets/js/quiz-engine.js"></script>
  <script>
    QuizEngine.init({
      id: "6e-lets-eat",
      title: "Let's Eat! — Food & Drinks",
      level: "6e — A1",
      sequence: "Séquence 4 — Alimentation",
      duration: "~10 min",
      intro: "Yum! Voici un quiz pour parler de la nourriture en anglais. Partitifs (some/any/a lot of), lexique des aliments, et des spécialités british et malgaches !",

      questions: [

        {
          type: "qcm",
          prompt: "What is the typical British breakfast called?",
          options: ["Continental breakfast", "Full English breakfast", "American pancakes", "French toast"],
          answer: 1,
          explanation: "Le « Full English breakfast » comprend bacon, sausages, eggs, baked beans, mushrooms, tomatoes et toast. Très copieux !",
        },

        {
          type: "matching",
          prompt: "Match each food with its category.",
          hint: "Indice : pense au groupe alimentaire.",
          pairs: [
            { left: "Banana",    right: "Fruit" },
            { left: "Carrot",    right: "Vegetable" },
            { left: "Cheese",    right: "Dairy product" },
            { left: "Bread",     right: "Cereal / starch" },
          ],
        },

        {
          type: "cloze",
          prompt: "Choisis le bon partitif.",
          parts: [
            { text: "There is " },
            { gap: ["a", "an", "some", "any"], answer: 2 },
            { text: " milk in the fridge. There are " },
            { gap: ["a", "an", "some", "any"], answer: 2 },
            { text: " apples too. But there isn't " },
            { gap: ["a", "an", "some", "any"], answer: 3 },
            { text: " bread." },
          ],
        },

        {
          type: "qcm",
          prompt: "« _____ apples do you want? — Three, please. »",
          options: ["How much", "How many", "How any", "How some"],
          answer: 1,
          explanation: "<i>How many</i> + nom dénombrable au pluriel (apples = des pommes, on peut les compter). <i>How much</i> + nom indénombrable (water, milk, sugar).",
        },

        {
          type: "vrai-faux",
          prompt: "« Fish and chips » is a famous British dish.",
          answer: "vrai",
          explanation: "Le fish and chips (poisson frit + frites) est le plat populaire emblématique de Grande-Bretagne, vendu dans les <i>chippies</i> (poissonneries-friteries).",
        },

        {
          type: "saisie",
          prompt: "« I want a glass ___ water. » (1 mot)",
          placeholder: "Exemple : with",
          answer: ["of", "Of", "OF"],
          explanation: "« A glass <b>of</b> water » = un verre d'eau. Comme : a cup of tea, a slice of bread, a piece of cake.",
        },

        {
          type: "multi",
          prompt: "Tick ALL <em>countable</em> nouns:",
          options: [
            "Apple",
            "Water",
            "Sugar",
            "Egg",
            "Tomato",
          ],
          answer: ["0", "3", "4"],
          explanation: "Apple, egg, tomato sont dénombrables (1 apple, 2 apples). Water et sugar sont indénombrables (on dit <i>some water</i>, pas <i>two waters</i>).",
        },

        {
          type: "qcm",
          prompt: "Quel plat malgache est célèbre dans le monde ?",
          options: [
            "Pad thai",
            "Romazava (a beef and leafy greens stew)",
            "Couscous",
            "Burger",
          ],
          answer: 1,
          explanation: "Le <b>romazava</b> est un plat national malgache : ragoût de zébu et de feuilles vertes (anamamy, brèdes mafane). Servi avec du riz, comme la plupart des plats malgaches !",
        },

        {
          type: "ordering",
          prompt: "Mets ces moments du repas dans l'ordre.",
          hint: "Une journée alimentaire typique.",
          items: [
            "Breakfast (early morning)",
            "Snack at school",
            "Lunch (around 12)",
            "Tea time (4 PM, very British)",
            "Dinner (in the evening)",
          ],
        },

        {
          type: "qcm",
          prompt: "Compare ces 2 phrases : « I'd like an apple. » vs « I want an apple. ». Quelle est la différence ?",
          options: [
            "« I'd like » est plus poli, « I want » est plus direct",
            "Les 2 sont identiques",
            "« I want » est faux en anglais",
            "« I'd like » est négatif",
          ],
          answer: 0,
          explanation: "<b>I'd like (I would like)</b> est plus poli, idéal au restaurant ou pour demander quelque chose. <b>I want</b> est correct mais plus direct, parfois perçu comme un peu brusque selon le contexte.",
        },

      ],
    });
  </script>

  <script src="../../assets/js/analytics.js" defer></script>
