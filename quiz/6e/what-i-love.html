  <script src="../../assets/js/quiz-engine.js"></script>
  <script>
    QuizEngine.init({
      id: "6e-what-i-love",
      title: "What I Love — Hobbies & Free Time",
      level: "6e — A1",
      sequence: "Séquence 3 — Goûts et hobbies",
      duration: "~10 min",
      intro: "Hello! Voici un quiz pour parler de tes goûts et tes hobbies. <em>I like</em> / <em>I don't like</em>, beaucoup de vocabulaire et un peu de fun!",

      questions: [

        {
          type: "qcm",
          prompt: "Comment dit-on « j'adore » ? (le verbe le plus fort)",
          options: ["I like", "I love", "I hate", "I prefer"],
          answer: 1,
          explanation: "<i>I love</i> = j'adore (le plus fort positif). <i>I like</i> = j'aime bien. <i>I hate</i> = je déteste. <i>I prefer</i> = je préfère.",
        },

        {
          type: "matching",
          prompt: "Match each hobby with the correct French translation.",
          hint: "Indice : pense aux activités du temps libre.",
          pairs: [
            { left: "Reading",       right: "Lire" },
            { left: "Drawing",       right: "Dessiner" },
            { left: "Swimming",      right: "Nager" },
            { left: "Playing video games", right: "Jouer aux jeux vidéo" },
          ],
        },

        {
          type: "cloze",
          prompt: "Complète avec la bonne forme du verbe au présent simple.",
          parts: [
            { text: "I " },
            { gap: ["like", "likes", "liking", "am like"], answer: 0 },
            { text: " football. My sister " },
            { gap: ["love", "loves", "loving", "is love"], answer: 1 },
            { text: " music. My parents " },
            { gap: ["don't like", "doesn't like", "no like", "not like"], answer: 0 },
            { text: " video games." },
          ],
        },

        {
          type: "qcm",
          prompt: "Choisis la bonne forme négative : « He _____ vegetables. »",
          options: [
            "don't like",
            "doesn't like",
            "no like",
            "not likes",
          ],
          answer: 1,
          explanation: "À la 3<sup>e</sup> personne du singulier (he/she/it), la forme négative est <i>doesn't + verbe</i>. Avec <i>I/you/we/they</i>, c'est <i>don't + verbe</i>.",
        },

        {
          type: "vrai-faux",
          prompt: "« Hobby » takes an « -ies » ending in the plural: <em>hobbies</em>.",
          answer: "vrai",
          explanation: "Quand un nom finit par consonne + y, on remplace y par -ies au pluriel : hobby → hobbies, story → stories, baby → babies.",
        },

        {
          type: "multi",
          prompt: "Tick ALL hobbies that involve being outdoors:",
          options: [
            "Hiking",
            "Watching TV",
            "Cycling",
            "Reading",
            "Surfing",
          ],
          answer: ["0", "2", "4"],
          explanation: "Hiking (randonnée), cycling (vélo) et surfing (surf) se pratiquent dehors. Watching TV et reading sont des activités d'intérieur.",
        },

        {
          type: "saisie",
          prompt: "Comment poses-tu cette question : « Tu aimes le chocolat ? »",
          placeholder: "Do you...",
          answer: [
            "do you like chocolate",
            "do you like chocolate?",
            "Do you like chocolate",
            "Do you like chocolate?",
          ],
          explanation: "Avec <i>you</i>, on commence la question par <i>Do you</i> + verbe à la base. Pour la 3<sup>e</sup> personne (he/she), ce serait <i>Does he/she like…?</i>",
        },

        {
          type: "ordering",
          prompt: "Mets ces hobbies dans l'ordre des plus calmes aux plus actifs.",
          hint: "Du plus calme au plus actif !",
          items: [
            "Reading a book",
            "Listening to music",
            "Painting",
            "Cycling",
            "Surfing big waves",
          ],
        },

        {
          type: "qcm",
          prompt: "What is « Harry Potter » primarily?",
          options: [
            "A British football club",
            "A British book and film series about a young wizard",
            "An American superhero",
            "A famous British painter",
          ],
          answer: 1,
          explanation: "Harry Potter est une série de 7 romans (J.K. Rowling, 1997-2007) et 8 films. Énorme phénomène culturel britannique. <i>Wizard</i> = sorcier.",
        },

        {
          type: "qcm",
          prompt: "Une activité typiquement malgache que beaucoup de jeunes pratiquent à Tana :",
          options: [
            "Ice skating",
            "Skateboarding (in Antaninarenina park)",
            "Skiing",
            "Surfing in the city centre",
          ],
          answer: 1,
          explanation: "Le skateboard est très populaire chez les jeunes Malgaches, notamment à Antaninarenina. Pas de glace ni de ski à Tana ! Pour le surf, il faut aller sur les côtes.",
        },

      ],
    });
  </script>

  <script src="../../assets/js/analytics.js" defer></script>
