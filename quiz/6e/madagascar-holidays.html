  <script src="../../assets/js/quiz-engine.js"></script>
  <script>
    QuizEngine.init({
      id: "6e-madagascar-holidays",
      title: "My Holidays in Madagascar",
      level: "6e — A1+",
      sequence: "Séquence 6 — Vacances et nature à Madagascar",
      duration: "~10 min",
      intro: "Final 6e quiz! Découvrons Madagascar en anglais : météo, paysages, animaux endémiques, lieux touristiques. Modal <em>can/can't</em>, futur (be going to), lexique de la nature.",

      questions: [

        {
          type: "qcm",
          prompt: "What is the most famous endemic animal of Madagascar?",
          options: ["The lion", "The lemur", "The kangaroo", "The koala"],
          answer: 1,
          explanation: "Le <b>lémurien</b> (lemur) est l'animal endémique emblématique de Madagascar — on en trouve plus de 100 espèces, toutes uniques au monde.",
        },

        {
          type: "matching",
          prompt: "Match each Malagasy place with what you can find/do there.",
          hint: "Indice : grands sites touristiques.",
          pairs: [
            { left: "Nosy Be",                right: "A tropical island with beaches" },
            { left: "Andasibe-Mantadia Park", right: "Watch indri lemurs in the rainforest" },
            { left: "Avenue of the Baobabs",  right: "Photograph giant ancient trees at sunset" },
            { left: "Tsingy de Bemaraha",     right: "Hike on sharp limestone formations" },
          ],
        },

        {
          type: "cloze",
          prompt: "Complete with <em>can</em> or <em>can't</em>.",
          parts: [
            { text: "In Madagascar, you " },
            { gap: ["can", "can't", "must", "are"], answer: 0 },
            { text: " see beautiful lemurs. You " },
            { gap: ["can", "can't", "won't", "are"], answer: 1 },
            { text: " find tigers — they don't live here! You " },
            { gap: ["can", "can't", "should", "are"], answer: 0 },
            { text: " enjoy delicious fruits like mango and lychee." },
          ],
        },

        {
          type: "qcm",
          prompt: "« What's the weather like in Madagascar in summer? »",
          options: [
            "It's very cold and snowy",
            "It's hot and rainy (rainy season)",
            "It's always foggy",
            "There is no summer in Madagascar",
          ],
          answer: 1,
          explanation: "L'été à Madagascar (novembre-avril dans l'hémisphère sud) est <b>chaud et pluvieux</b> — c'est la saison des pluies. L'hiver (mai-octobre) est sec et plus frais sur les hauts-plateaux.",
        },

        {
          type: "vrai-faux",
          prompt: "Madagascar has the same seasons as Europe (winter in December).",
          answer: "faux",
          explanation: "Faux ! Madagascar est dans l'<b>hémisphère sud</b>. Décembre = été (saison des pluies, chaud), juin-juillet = hiver (saison sèche, plus frais). Les saisons sont inversées par rapport à l'Europe.",
        },

        {
          type: "saisie",
          prompt: "Comment dit-on « les baobabs » en anglais ? (le mot est très proche)",
          placeholder: "Exemple : the lemurs",
          answer: ["the baobabs", "baobabs", "Baobabs", "The baobabs", "BAOBABS"],
          explanation: "<b>Baobab</b> est un mot international (de la même origine que le mot malgache <i>baobaba</i>). Madagascar abrite 7 des 9 espèces de baobabs au monde.",
        },

        {
          type: "multi",
          prompt: "Tick ALL activities you can do during holidays in Madagascar:",
          options: [
            "Swim in the Indian Ocean",
            "Ski in the Alps",
            "Watch lemurs",
            "Visit Big Ben",
            "Hike to a waterfall",
          ],
          answer: ["0", "2", "4"],
          explanation: "Swimming, lemur watching et hiking sont possibles à Madagascar. Pas de ski (pas de neige) et Big Ben est à Londres !",
        },

        {
          type: "qcm",
          prompt: "« I _____ visit Andasibe Park next summer. » (futur d'intention)",
          options: ["am going to", "going to", "go to", "will go"],
          answer: 0,
          explanation: "<i>be going to + verbe</i> = futur d'intention (un projet déjà décidé). <i>I am going to visit</i> = je vais visiter (j'ai prévu).",
        },

        {
          type: "ordering",
          prompt: "Put these holiday steps in chronological order.",
          hint: "From planning to memories.",
          items: [
            "Plan the trip on a map",
            "Pack your suitcase",
            "Travel to the destination",
            "Have fun and discover places",
            "Look at the photos when you come back",
          ],
        },

        {
          type: "qcm",
          prompt: "Why is Madagascar called the « Eighth Continent »?",
          options: [
            "Because it is bigger than other continents",
            "Because more than 80% of its species exist nowhere else on Earth",
            "Because it is colder than the Arctic",
            "Because it has 8 official capitals",
          ],
          answer: 1,
          explanation: "Madagascar est surnommée le « <b>Eighth Continent</b> » à cause de son extraordinaire endémisme : plus de <b>80% de sa flore et faune</b> sont uniques au monde. C'est dû à son isolement géologique de plus de 88 millions d'années.",
        },

      ],
    });
  </script>

  <script src="../../assets/js/analytics.js" defer></script>
